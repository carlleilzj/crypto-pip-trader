[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-pip-trader"
version = "0.3.1"
description = "Crypto perpetual futures momentum trading with PIP exit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.1",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
include = ["research*", "backtest*", "live*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
minversion = "8.0"

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]

[tool.ruff.lint.per-file-ignores]
# Test doubles intentionally mirror broker signatures even when args are
# unused; ARG/F841 noise here is not actionable signal.
"tests/*" = ["ARG", "F841"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true