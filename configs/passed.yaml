# Frozen after breakout gate pass (2026-08-31). Do not retune against OOS.
#
# Strategy changed from 30d time-momentum to N-bar breakout entry after the
# parity fix showed momentum (p=0.066) and EMA crossover (p=0.347) failed the
# block-permutation gate. Breakout N=40 passes: ret +19.2%, Martin 4.70,
# dd -6.7%, beats buy&hold (-11.4%), block-perm p=0.0488 (n=40) / 0.0149 (n=200).
#
# Calibrated on train 2020-2021 (N=40 by combined Calmar), validated 2022-2024.06,
# final verdict on full OOS 2022-01→2026-08.
symbol: BTCUSDT
symbols:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
interval: 1h
market: usdm

strategy: breakout_n40_pip_exit
signal: breakout
n: 40                 # breakout window: close breaks rolling N-bar high/low
hold: 720
mode: long_short
exit_mode: pip
pip_n: 5
min_bars: 24
fit_exit: 0.0

# Stop-loss (applied in live execution). Diagnostic showed PIP+stop is the
# core edge: pure time exit BTC train +0.3% vs +77% with PIP+stop.
stop_pct: 0.06        # hard stop: flatten on -6% from entry
use_exchange_stop: true   # also place a reduce-close STOP_MARKET (mark price) on the exchange

notional_frac: 0.24489269335696373
calibrated_from:
  train_hours: 17520
  train_dd: -0.408
  target_dd: 0.20
  base_frac: 0.5

costs:
  taker_fee: 0.0004
  slippage_bps: 1.0
  use_funding: true

risk:
  notional_frac: 0.24489269335696373
  max_leverage: 2.0
  daily_loss_halt: 0.05
  max_drawdown_halt: 0.15

backtest:
  start_equity: 1000.0
  fill: next_open
