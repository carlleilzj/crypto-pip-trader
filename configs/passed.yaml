# Frozen after P0 gate pass. Do not retune against OOS.
symbol: BTCUSDT
symbols:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
interval: 1h
market: usdm

strategy: mom_30d_cal20_pip_exit
lookback: 720
hold: 720
mode: long_short
exit_mode: pip
pip_n: 5
min_bars: 24
fit_exit: 0.0

# Stop-loss and trailing stop (applied in live execution)
# Backtested on 3-coin portfolio (train 2020-2022 + OOS 2022-2026.08):
# stop 6%: OOS ret +23.7% vs base +20.1%, max_dd -4.7% vs -4.8%, martin 11.6 vs 10.3
stop_pct: 0.06       # hard stop: flatten on -6% from entry
use_exchange_stop: true   # also place a reduce-close STOP_MARKET (mark price) on the exchange
# trail_arm: 0.10      # trailing stop: arm after +10% profit (backtested: negative
# trail_giveback: 0.05 # contribution on both train and OOS — keep disabled)

notional_frac: 0.24489269335696373
calibrated_from:
  train_hours: 17520
  train_dd: -0.408
  target_dd: 0.20
  base_frac: 0.5

costs:
  taker_fee: 0.0004
  slippage_bps: 1.0
  use_funding: true

risk:
  notional_frac: 0.24489269335696373
  max_leverage: 2.0
  daily_loss_halt: 0.05
  max_drawdown_halt: 0.15

backtest:
  start_equity: 1000.0
  fill: next_open