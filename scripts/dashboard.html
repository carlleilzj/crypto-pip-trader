<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PERP · live</title>
<style>
:root { --bg:#07090d; --card:#10151c; --line:#1c2733; --txt:#e8eef7; --mut:#7d8da3; --up:#26a69a; --dn:#ef5350; --acc:#5b9dff; }
*{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:13px/1.4 ui-sans-serif,system-ui}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.04em}
.mut{color:var(--mut)} .ok{color:var(--up)} .bad{color:var(--dn)}
.row{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.px{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.tag{border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:11px;cursor:pointer}
.tag.on{background:#1c2733;color:#e8eef7}
.leg{display:flex;gap:12px;align-items:center;font-size:11px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
#chart{width:100%;height:calc(100vh - 58px);display:block;background:#07090d}
</style>
</head>
<body>
<header>
  <div class="row">
    <div class="brand" id="sym">BTCUSDT</div>
    <div class="leg" id="tabs"></div>
    <div class="tag" id="venue">—</div>
    <div class="tag" id="pos">FLAT</div>
    <div class="mut" id="bar">—</div>
    <div class="leg">
      <span><span class="dot" style="background:#5b9dff"></span> 预测走势</span>
      <span><span class="dot" style="background:#ffd166"></span> 实际走势</span>
      <span><span class="dot" style="background:#26a69a"></span> 入场</span>
      <span><span class="dot" style="background:#ef5350"></span> 出场</span>
    </div>
  </div>
  <div class="row">
    <div class="px" id="last">—</div>
    <div id="chg" class="mut">—</div>
    <div class="mut" id="entry">entry —</div>
    <div class="mut" id="fit">fit —</div>
    <div class="mut" id="hold">hold —</div>
    <div class="mut" id="why">exit if fit &lt; 0 after 24h</div>
  </div>
</header>
<canvas id="chart"></canvas>
<script>
const $ = s => document.querySelector(s);
const SYMS = ['BTCUSDT','ETHUSDT','SOLUSDT'];
let symbol = new URLSearchParams(location.search).get('symbol') || 'BTCUSDT';
if(!SYMS.includes(symbol)) symbol = 'BTCUSDT';
let chart = {bars:[], pred:[], actual:[], ghost:[], marks:[], entry:null, pos:0, source:''};

function fmt(n,d=2){ if(n==null||Number.isNaN(n)) return '—'; return Number(n).toLocaleString(undefined,{maximumFractionDigits:d}); }

function draw(){
  const c = $('#chart');
  const dpr = window.devicePixelRatio || 1;
  const w = c.width = Math.floor(c.clientWidth * dpr);
  const h = c.height = Math.floor(c.clientHeight * dpr);
  const x = c.getContext('2d');
  x.clearRect(0,0,w,h);
  const bars = chart.bars;
  if(!bars.length) return;
  const pad = {t:20,b:30,l:60,r:20};
  const pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
  const lo = Math.min(...bars), hi = Math.max(...bars);
  const range = hi - lo || 1;
  const toX = (i) => pad.l + i / (bars.length - 1) * pw;
  const toY = (v) => pad.t + ph - (v - lo) / range * ph;
  const grey = '#1c2733';
  x.strokeStyle = grey; x.lineWidth = 1;
  for(let i=0;i<bars.length;i++){ x.beginPath(); x.moveTo(toX(i),pad.t); x.lineTo(toX(i),pad.t+ph); x.stroke(); }
  const yticks = 5;
  for(let i=0;i<=yticks;i++){ const y = pad.t + i / yticks * ph; x.beginPath(); x.moveTo(pad.l,y); x.lineTo(pad.l+pw,y); x.strokeStyle = grey; x.stroke(); }
  x.strokeStyle = '#5b9dff'; x.lineWidth = 2; x.beginPath();
  (chart.pred||[]).forEach((v,i)=>{ const xi = toX(i), yi = toY(v); i===0?x.moveTo(xi,yi):x.lineTo(xi,yi); });
  x.stroke();
  x.strokeStyle = '#ffd166'; x.lineWidth = 2; x.beginPath();
  (chart.actual||[]).forEach((v,i)=>{ const xi = toX(i), yi = toY(v); i===0?x.moveTo(xi,yi):x.lineTo(xi,yi); });
  x.stroke();
  if(chart.entry!=null){ x.strokeStyle='#26a69a'; x.lineWidth=2; x.setLineDash([6,4]); x.beginPath(); x.moveTo(pad.l,toY(chart.entry)); x.lineTo(pad.l+pw,toY(chart.entry)); x.stroke(); x.setLineDash([]); }
  (chart.marks||[]).forEach(m=>{ x.fillStyle=m.color||'#ef5350'; x.beginPath(); x.arc(toX(m.i),toY(m.v),4*dpr,0,6.29); x.fill(); });
  (chart.ghost||[]).forEach((v,i)=>{ x.fillStyle='rgba(91,157,255,0.15)'; x.beginPath(); x.arc(toX(i),toY(v),3*dpr,0,6.29); x.fill(); });
  x.fillStyle = '#7d8da3'; x.font = `${11*dpr}px ui-monospace`;
  x.textAlign = 'right'; x.textBaseline = 'bottom';
  for(let i=0;i<=yticks;i++){ const y = pad.t + i / yticks * ph; const v = lo + (1 - i / yticks) * range; x.fillText(fmt(v,hi>1000?0:2),pad.l-6*dpr,y+4*dpr); }
}

function updateUI(){
  const b = chart.bars||[], n = b.length;
  if(n){ const last = b[n-1]; $('#last').textContent = fmt(last,last>1000?0:2); }
  $('#pos').textContent = chart.pos===0?'FLAT':chart.pos>0?'LONG':'SHORT';
  $('#venue').textContent = chart.source||'—';
  if(chart.entry!=null) $('#entry').textContent = 'entry '+fmt(chart.entry,0);
  $('#tabs').innerHTML = SYMS.map(s=>`<span class="tag ${s===symbol?'on':''}" onclick="switchSym('${s}')">${s}</span>`).join(' ');
}

function switchSym(sym){ symbol = sym; history.replaceState(null,'','?symbol='+symbol); fetchChart(); }

async function fetchChart(){
  try {
    const r = await fetch('/api/chart?symbol='+symbol);
    chart = await r.json();
    updateUI();
    draw();
  } catch(e) { console.error('fetch error',e); }
}

fetchChart();
setInterval(fetchChart, 30000);
window.addEventListener('resize', draw);
</script>
</body>
</html>
